name: Minecraft Server 1.12.2

on:
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: Minutos de ejecucion para una prueba manual
        required: true
        default: 335
        type: number
  schedule:
    - cron: "0 19,1 * * *"

permissions:
  contents: read

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      SERVER_JAR: ${{ vars.SERVER_JAR }}
      JAVA_OPTS: ${{ vars.JAVA_OPTS }}
      OPS: ${{ vars.OPS }}
      RUNTIME_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_minutes || 335 }}

    steps:
      - name: Obtener configuracion
        uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          docker pull ghcr.io/playit-cloud/playit-agent:1.0

      - name: Configurar Oracle S3 (rclone)
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf

      - name: Ejecutar Servidor
        run: bash ./scripts/run-server.sh
