name: Minecraft Paper Crossplay

on:
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: Minutos de ejecucion para una prueba manual
        required: true
        default: 335
        type: number
      enable_ssh:
        description: Abrir SSH temporal gratis con tmate
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "0 19,1 * * *"

permissions:
  contents: read

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      AUTH_DB_HOST: ${{ secrets.AUTH_DB_HOST }}
      AUTH_DB_USER: ${{ secrets.AUTH_DB_USER }}
      AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
      AUTH_DB_PORT: ${{ vars.AUTH_DB_PORT || '5432' }}
      AUTH_DB_NAME: ${{ vars.AUTH_DB_NAME || 'postgres' }}
      AUTH_DB_TABLE: ${{ vars.AUTH_DB_TABLE || 'authme' }}
      PAPER_VERSION: ${{ vars.PAPER_VERSION || '26.2' }}
      PLAYIT_IMAGE: ${{ vars.PLAYIT_IMAGE || 'ghcr.io/playit-cloud/playit-agent:0.17.1' }}
      JAVA_PUBLIC_ADDRESS: ${{ vars.JAVA_PUBLIC_ADDRESS || 'bounce-cart.tun.ply.gg:25565' }}
      BEDROCK_PUBLIC_ADDRESS: ${{ vars.BEDROCK_PUBLIC_ADDRESS || '147.185.221.231:38579' }}
      HEALTHCHECK_INTERVAL: ${{ vars.HEALTHCHECK_INTERVAL || '300' }}
      JAVA_OPTS: ${{ vars.JAVA_OPTS }}
      OPS: ${{ vars.OPS }}
      RUNTIME_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_minutes || 335 }}

    steps:
      - name: Reservar margen para el cierre
        run: echo "RUN_DEADLINE_EPOCH=$(($(date +%s) + 335 * 60))" >> "$GITHUB_ENV"

      - name: Obtener configuracion
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libargon2-1 postgresql-client python3-yaml rclone
          docker pull "$PLAYIT_IMAGE"

      - name: Configurar Oracle S3 (rclone)
        env:
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
        run: |
          install -d -m 700 ~/.config/rclone
          umask 077
          printf '%s\n' "$RCLONE_CONF_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Abrir SSH temporal gratis con tmate
        id: tmate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_ssh }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        with:
          detached: true
          limit-access-to-actor: true

      - name: Ejecutar Servidor
        env:
          TMATE_SSH_COMMAND: ${{ steps.tmate.outputs.ssh-command }}
        run: |
          if [[ -n "$TMATE_SSH_COMMAND" ]]; then
            echo "::notice title=SSH tmate activo::$TMATE_SSH_COMMAND"
            echo "SSH tmate activo: $TMATE_SSH_COMMAND"
          fi
          exec bash ./scripts/run-server.sh
